name: Publish container image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      ASSET: evolution-api-2.4.0-rc2-newsletter-20260825.tar.gz
      LEGACY_LOCAL: evolution-api:2.4.0-rc2-newsletter-20260825
      REGISTRY_IMAGE: ghcr.io/luizguilherme5/evolution-api-newsletters
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Load the exact functional 2026-08-25 image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download legacy-image-20260825 --pattern "$ASSET"
          echo "3fc2aabbe49e5b7b74830baec425440628bad2af04c4829f96f98aa19411d975  $ASSET" | sha256sum --check --strict
          gzip --decompress --keep "$ASSET"
          docker load --input "${ASSET%.gz}"
          docker image inspect "$LEGACY_LOCAL"

      - name: Publish the preserved functional base
        run: |
          docker tag "$LEGACY_LOCAL" "$REGISTRY_IMAGE:legacy-20260825"
          docker push "$REGISTRY_IMAGE:legacy-20260825"

      - name: Apply the inbound newsletter patch
        run: |
          docker build --build-arg "BASE_IMAGE=$LEGACY_LOCAL" --tag "$REGISTRY_IMAGE:2.4.0-rc2-newsletters.3" .
          docker tag "$REGISTRY_IMAGE:2.4.0-rc2-newsletters.3" "$REGISTRY_IMAGE:2.4.0-rc2-newsletters.1"
          docker tag "$REGISTRY_IMAGE:2.4.0-rc2-newsletters.3" "$REGISTRY_IMAGE:latest"
          docker push "$REGISTRY_IMAGE:2.4.0-rc2-newsletters.3"
          docker push "$REGISTRY_IMAGE:2.4.0-rc2-newsletters.1"
          docker push "$REGISTRY_IMAGE:latest"
